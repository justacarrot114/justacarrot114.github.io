<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>SETTING - 胡萝卜的博客</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <meta name="description" content="设置页（彩蛋）">
  <meta name="theme-color" content="#000000">
  <link rel="shortcut icon" href="/favicon.png">
  <link rel="preload" href="/assets/fonts/fusion-pixel-12.woff2" as="font" type="font/woff2" crossorigin>
  <style>
    @font-face {
      font-family: "Fusion Pixel";
      src: url("/assets/fonts/fusion-pixel-12.woff2") format("woff2");
      font-display: swap;
      font-weight: 400;
      font-style: normal;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
    }

    body {
      overflow: hidden;
      background-color: #000000;
      background-image:
        radial-gradient(2px 2px at 14% 22%, #ffffff 50%, transparent 51%),
        radial-gradient(2px 2px at 28% 42%, #ffffff 50%, transparent 51%),
        radial-gradient(2px 2px at 62% 16%, #ffffff 50%, transparent 51%),
        radial-gradient(2px 2px at 84% 46%, #ffffff 50%, transparent 51%),
        radial-gradient(2px 2px at 72% 78%, #ffffff 50%, transparent 51%),
        radial-gradient(2px 2px at 20% 70%, #ffffff 50%, transparent 51%);
      background-repeat: no-repeat;
      color: #ffffff;
      font-family: "Fusion Pixel", "Courier New", monospace;
      image-rendering: pixelated;
      -webkit-font-smoothing: none;
    }

    .screen {
      position: fixed;
      inset: 14px;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 5vh 24px 18px;
      background: #000000;
      border: 3px solid #ffffff;
      box-shadow:
        0 0 0 3px #000000,
        inset 0 0 0 3px #000000,
        inset 0 0 0 5px #ffffff;
    }

    .screen::before,
    .screen::after {
      content: "";
      position: absolute;
      width: 10px;
      height: 10px;
      background: #ffffff;
    }

    .screen::before {
      top: -3px;
      left: -3px;
    }

    .screen::after {
      bottom: -3px;
      right: -3px;
    }

    .lazy-text {
      margin-top: 24px;
      font-size: 60px;
      font-weight: 400;
      letter-spacing: 4px;
      line-height: 1.5;
      color: #ffffff;
      text-align: center;
    }

    .note {
      display: inline-block;
      padding: 0;
      border: 0;
      background: transparent;
      color: #ffffff;
      font-family: inherit;
      font-size: inherit;
      line-height: 1;
      vertical-align: baseline;
      cursor: pointer;
      animation: note-wobble 1.8s steps(2, end) infinite;
      will-change: transform, opacity;
    }

    .note:hover,
    .note:focus-visible {
      animation-play-state: paused;
      transform: translateY(-0.1em);
      outline: none;
    }

    .note.is-falling {
      animation: note-fall 0.62s steps(8, end) forwards;
      pointer-events: none;
    }

    @keyframes note-wobble {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-0.22em);
      }
    }

    @keyframes note-fall {
      0% {
        transform: translateY(0);
        opacity: 1;
      }
      18% {
        transform: translateY(-0.3em);
        opacity: 1;
      }
      100% {
        transform: translateY(320%);
        opacity: 0;
      }
    }

    .stage {
      flex: 1;
      width: 100%;
    }

    .back {
      display: inline-block;
      padding: 8px 18px;
      font-size: 24px;
      line-height: 1;
      letter-spacing: 3px;
      text-decoration: none;
      color: #ffffff;
      background: transparent;
      border: 2px solid #ffffff;
    }

    .back:hover,
    .back:focus-visible {
      color: #000000;
      background: #ffffff;
      border-color: #ffffff;
      outline: none;
    }

    .egg-float {
      position: fixed;
      left: 50%;
      bottom: 14vh;
      z-index: 6;
      transform: translateX(-50%);
      cursor: grab;
      touch-action: none;
    }

    .egg-float.is-dragging {
      cursor: grabbing;
    }

    .egg-float.is-dragging .egg-slices {
      animation-play-state: paused;
    }

    .egg-burst {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 300px;
      height: 300px;
      transform: translate(-50%, -50%);
      opacity: 0;
      pointer-events: none;
    }

    .egg-wrap {
      position: relative;
      width: 108px;
      aspect-ratio: 320 / 988;
      opacity: 0;
      transform: scale(0.4) translateY(10px);
      transition:
        opacity 0.28s linear,
        transform 0.46s cubic-bezier(0.2, 1.8, 0.4, 1);
      will-change: transform, opacity;
    }

    .egg-float.is-visible .egg-wrap {
      opacity: 1;
      transform: scale(1) translateY(0);
      transition-delay: 0.16s;
    }

    .egg-float.is-visible .egg-burst {
      animation: burst-flash 0.6s steps(5, end) forwards;
    }

    .egg-slices {
      position: absolute;
      inset: 0;
    }

    .egg-slice {
      position: absolute;
      inset: 0;
      background-image: url("/assets/pet/carrot-photo.png?v=1");
      background-size: 100% 100%;
      background-repeat: no-repeat;
      cursor: grab;
      touch-action: none;
      user-select: none;
      -webkit-user-drag: none;
      will-change: transform;
    }

    .egg-slice.is-held {
      cursor: grabbing;
    }

    .cut-preview {
      position: absolute;
      height: 2px;
      background: #ffffff;
      opacity: 0.7;
      pointer-events: none;
      transform-origin: 0 50%;
      z-index: 99;
    }

    .cut-flash {
      position: absolute;
      height: 2px;
      background: #ffffff;
      opacity: 0;
      pointer-events: none;
      transform-origin: 0 50%;
      z-index: 99;
      animation: cut-flash 0.34s steps(4, end) forwards;
    }

    @keyframes cut-flash {
      0% {
        opacity: 1;
      }
      70% {
        opacity: 0.9;
      }
      100% {
        opacity: 0;
      }
    }

    .egg-float.is-visible .egg-slices {
      animation: egg-float 2.8s ease-in-out infinite 0.5s;
    }

    @keyframes burst-flash {
      0% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.55);
      }
      20% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(0.8);
      }
      55% {
        opacity: 0.85;
        transform: translate(-50%, -50%) scale(1);
      }
      100% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(1.3);
      }
    }

    @keyframes egg-float {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-6px);
      }
    }

    @media (max-width: 640px) {
      .screen {
        inset: 8px;
        padding: 4vh 14px 14px;
      }

      .lazy-text {
        font-size: 36px;
        letter-spacing: 3px;
      }

      .back {
        font-size: 24px;
      }

      .egg-wrap {
        width: 88px;
      }

      .egg-burst {
        width: 240px;
        height: 240px;
      }
    }
  </style>
</head>
<body>
  <main class="screen">
    <p class="lazy-text">太懒了，<button type="button" class="note" id="note" aria-label="点击“没”字">没</button>有做</p>

    <div class="stage" aria-hidden="true"></div>

    <a class="back" href="/">返回</a>
  </main>

  <div class="egg-float" id="eggFloat">
    <svg class="egg-burst" viewBox="0 0 24 24" shape-rendering="crispEdges" aria-hidden="true" focusable="false">
      <g fill="#ffffff">
        <rect x="11" y="1" width="2" height="6"></rect>
        <rect x="11" y="17" width="2" height="6"></rect>
        <rect x="1" y="11" width="6" height="2"></rect>
        <rect x="17" y="11" width="6" height="2"></rect>
      </g>
      <g fill="#ffffff">
        <rect x="5" y="5" width="2" height="2"></rect>
        <rect x="17" y="5" width="2" height="2"></rect>
        <rect x="5" y="17" width="2" height="2"></rect>
        <rect x="17" y="17" width="2" height="2"></rect>
      </g>
    </svg>

    <div class="egg-wrap" id="egg">
      <div class="egg-slices" id="eggSlices"></div>
    </div>
  </div>

  <script>
    (function(){
      var note = document.getElementById('note');
      var eggFloat = document.getElementById('eggFloat');
      var slicesEl = document.getElementById('eggSlices');
      if (!note || !eggFloat || !slicesEl) return;

      note.addEventListener('click', function(){
        if (note.classList.contains('is-falling')) return;
        note.classList.add('is-falling');
        setTimeout(function(){
          eggFloat.classList.add('is-visible');
        }, 520);
      });

      var MAX_TILES = 9;
      var GAP = 5;
      var tiles = [];
      var zTop = 1;

      function clipPathOf(poly) {
        return 'polygon(' + poly.map(function(p){
          return p.x.toFixed(2) + '% ' + p.y.toFixed(2) + '%';
        }).join(',') + ')';
      }

      function applyClip(tile) {
        var cp = clipPathOf(tile.poly);
        tile.el.style.clipPath = cp;
        tile.el.style.webkitClipPath = cp;
      }

      function toPx(poly, w, h) {
        return poly.map(function(p){
          return { x: p.x / 100 * w, y: p.y / 100 * h };
        });
      }

      function toPercent(poly, w, h) {
        return poly.map(function(p){
          return { x: p.x / w * 100, y: p.y / h * 100 };
        });
      }

      function polyArea(poly) {
        var s = 0;
        for (var i = 0; i < poly.length; i++) {
          var a = poly[i];
          var b = poly[(i + 1) % poly.length];
          s += a.x * b.y - b.x * a.y;
        }
        return Math.abs(s) / 2;
      }

      function pointInPoly(x, y, poly) {
        var inside = false;
        for (var i = 0, j = poly.length - 1; i < poly.length; j = i++) {
          var xi = poly[i].x;
          var yi = poly[i].y;
          var xj = poly[j].x;
          var yj = poly[j].y;
          if (((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi)) {
            inside = !inside;
          }
        }
        return inside;
      }

      function cleanPoly(poly) {
        var out = [];
        for (var i = 0; i < poly.length; i++) {
          var p = poly[i];
          var q = out[out.length - 1];
          if (!q || Math.hypot(q.x - p.x, q.y - p.y) > 0.3) out.push(p);
        }
        if (out.length > 1) {
          var f = out[0];
          var l = out[out.length - 1];
          if (Math.hypot(f.x - l.x, f.y - l.y) < 0.3) out.pop();
        }
        return out;
      }

      function segIntersect(p, q, a, b) {
        var d1x = q.x - p.x;
        var d1y = q.y - p.y;
        var d2x = b.x - a.x;
        var d2y = b.y - a.y;
        var denom = d1x * d2y - d1y * d2x;
        if (Math.abs(denom) < 1e-9) return null;
        var t = ((a.x - p.x) * d2y - (a.y - p.y) * d2x) / denom;
        var u = ((a.x - p.x) * d1y - (a.y - p.y) * d1x) / denom;
        if (t >= 0 && t <= 1 && u >= 0 && u <= 1) {
          return { x: p.x + d1x * t, y: p.y + d1y * t, t: t };
        }
        return null;
      }

      function segmentPolyPoints(ax, ay, bx, by, poly) {
        var pts = [];
        if (pointInPoly(ax, ay, poly)) pts.push({ x: ax, y: ay, t: 0 });
        if (pointInPoly(bx, by, poly)) pts.push({ x: bx, y: by, t: 1 });
        for (var i = 0; i < poly.length; i++) {
          var c = poly[i];
          var d = poly[(i + 1) % poly.length];
          var hit = segIntersect({ x: ax, y: ay }, { x: bx, y: by }, c, d);
          if (hit) pts.push(hit);
        }
        pts.sort(function(p, q){ return p.t - q.t; });
        var out = [];
        for (var k = 0; k < pts.length; k++) {
          if (!out.length || Math.abs(pts[k].t - out[out.length - 1].t) > 1e-4) out.push(pts[k]);
        }
        return out;
      }

      function splitPoly(poly, p0, dir) {
        var nx = -dir.y;
        var ny = dir.x;
        var d = poly.map(function(v){
          return nx * (v.x - p0.x) + ny * (v.y - p0.y);
        });
        var left = [];
        var right = [];
        for (var i = 0; i < poly.length; i++) {
          var j = (i + 1) % poly.length;
          var a = poly[i];
          var b = poly[j];
          var da = d[i];
          var db = d[j];
          if (da >= 0) left.push(a);
          if (da <= 0) right.push(a);
          if ((da > 0 && db < 0) || (da < 0 && db > 0)) {
            var t = da / (da - db);
            var ip = { x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t };
            left.push(ip);
            right.push(ip);
          }
        }
        return [cleanPoly(left), cleanPoly(right)];
      }

      function setTransform(tile, animate) {
        tile.el.style.transition = animate
          ? 'transform 0.32s cubic-bezier(0.22, 1.3, 0.36, 1)'
          : 'none';
        tile.el.style.transform = 'translate(' + tile.tx + 'px, ' + tile.ty + 'px)';
      }

      function createTile(poly, tx, ty) {
        var el = document.createElement('div');
        el.className = 'egg-slice';
        var tile = { el: el, poly: poly, tx: tx || 0, ty: ty || 0 };
        applyClip(tile);
        el.style.transform = 'translate(' + tile.tx + 'px, ' + tile.ty + 'px)';
        slicesEl.appendChild(el);
        tiles.push(tile);
        return tile;
      }

      function cut(tile, x1, y1, x2, y2) {
        if (tiles.length >= MAX_TILES) return false;

        var r = slicesEl.getBoundingClientRect();
        var w = r.width;
        var h = r.height;
        if (!w || !h) return false;

        var lAx = x1 - tile.tx;
        var lAy = y1 - tile.ty;
        var lBx = x2 - tile.tx;
        var lBy = y2 - tile.ty;
        var dx = lBx - lAx;
        var dy = lBy - lAy;
        var len = Math.sqrt(dx * dx + dy * dy);
        if (len < 10) return false;

        var poly = toPx(tile.poly, w, h);
        var pts = segmentPolyPoints(lAx, lAy, lBx, lBy, poly);
        if (pts.length < 2) return false;

        var ax = (pts[0].x + pts[1].x) / 2;
        var ay = (pts[0].y + pts[1].y) / 2;

        var dir = { x: dx / len, y: dy / len };
        var parts = splitPoly(poly, { x: ax, y: ay }, dir);
        var a = parts[0];
        var b = parts[1];
        if (a.length < 3 || b.length < 3) return false;

        var total = w * h;
        if (polyArea(a) / total < 0.04 || polyArea(b) / total < 0.04) return false;

        var nx = -dir.y;
        var ny = dir.x;
        var tx0 = tile.tx;
        var ty0 = tile.ty;

        tile.poly = toPercent(a, w, h);
        applyClip(tile);
        tile.tx = tx0 + nx * GAP;
        tile.ty = ty0 + ny * GAP;
        setTransform(tile, true);

        var other = createTile(toPercent(b, w, h), tx0, ty0);
        requestAnimationFrame(function(){
          requestAnimationFrame(function(){
            other.tx = tx0 - nx * GAP;
            other.ty = ty0 - ny * GAP;
            setTransform(other, true);
          });
        });

        var ang = Math.atan2(y2 - y1, x2 - x1);
        var clen = Math.sqrt((x2 - x1) * (x2 - x1) + (y2 - y1) * (y2 - y1));
        var flash = document.createElement('div');
        flash.className = 'cut-flash';
        flash.style.width = clen + 'px';
        flash.style.left = x1 + 'px';
        flash.style.top = y1 + 'px';
        flash.style.transform = 'translate(0, -50%) rotate(' + ang + 'rad)';
        slicesEl.appendChild(flash);
        setTimeout(function(){
          if (flash.parentNode) flash.parentNode.removeChild(flash);
        }, 400);

        return true;
      }

      var gesture = null;
      var previewEl = null;
      var CUT_MIN = 30;
      var DRAG_SLOP = 6;

      function tileAt(px, py) {
        var r = slicesEl.getBoundingClientRect();
        var w = r.width;
        var h = r.height;
        if (!w || !h) return null;
        for (var i = tiles.length - 1; i >= 0; i--) {
          var t = tiles[i];
          var poly = t.poly.map(function(p){
            return { x: p.x / 100 * w + t.tx, y: p.y / 100 * h + t.ty };
          });
          if (pointInPoly(px, py, poly)) return t;
        }
        return null;
      }

      function onGestureDown(e) {
        if (e.button !== 0 || gesture) return;
        if (!eggFloat.classList.contains('is-visible')) return;
        var r = slicesEl.getBoundingClientRect();
        var px = e.clientX - r.left;
        var py = e.clientY - r.top;
        var hit = tileAt(px, py);
        var g = {
          pointerId: e.pointerId,
          clientX: e.clientX,
          clientY: e.clientY,
          sx: px,
          sy: py,
          mode: hit ? 'drag' : 'cut',
          tile: hit,
          tx0: hit ? hit.tx : 0,
          ty0: hit ? hit.ty : 0,
          armed: false,
          moved: false
        };
        gesture = g;
        if (hit) {
          hit.el.style.zIndex = ++zTop;
          hit.el.style.transition = 'none';
          hit.el.classList.add('is-held');
          eggFloat.classList.add('is-dragging');
        }
        document.addEventListener('pointermove', onPointerMove);
        document.addEventListener('pointerup', onPointerUp);
        document.addEventListener('pointercancel', onPointerUp);
        e.preventDefault();
      }

      function onPointerMove(e) {
        var g = gesture;
        if (!g || e.pointerId !== g.pointerId) return;
        var dx = e.clientX - g.clientX;
        var dy = e.clientY - g.clientY;
        var dist = Math.sqrt(dx * dx + dy * dy);
        if (g.mode === 'drag') {
          if (!g.moved && dist > DRAG_SLOP) g.moved = true;
          if (g.moved) {
            g.tile.tx = g.tx0 + dx;
            g.tile.ty = g.ty0 + dy;
            setTransform(g.tile, false);
          }
          return;
        }
        if (dist < CUT_MIN) return;
        var r = slicesEl.getBoundingClientRect();
        g.armed = true;
        showPreview(g.sx, g.sy, e.clientX - r.left, e.clientY - r.top);
      }

      function onPointerUp(e) {
        var g = gesture;
        if (!g || e.pointerId !== g.pointerId) return;
        document.removeEventListener('pointermove', onPointerMove);
        document.removeEventListener('pointerup', onPointerUp);
        document.removeEventListener('pointercancel', onPointerUp);
        if (g.mode === 'drag') {
          if (g.tile) {
            g.tile.el.classList.remove('is-held');
            eggFloat.classList.remove('is-dragging');
          }
        } else if (g.armed) {
          var r = slicesEl.getBoundingClientRect();
          cutLine(g.sx, g.sy, e.clientX - r.left, e.clientY - r.top);
        }
        hidePreview();
        gesture = null;
      }

      function cutLine(x1, y1, x2, y2) {
        var r = slicesEl.getBoundingClientRect();
        var w = r.width;
        var h = r.height;
        if (!w || !h) return false;
        var targets = [];
        for (var i = 0; i < tiles.length; i++) {
          var t = tiles[i];
          var poly = toPx(t.poly, w, h);
          var pts = segmentPolyPoints(x1 - t.tx, y1 - t.ty, x2 - t.tx, y2 - t.ty, poly);
          if (pts.length >= 2) targets.push(t);
        }
        var any = false;
        for (var j = 0; j < targets.length; j++) {
          if (tiles.length >= MAX_TILES) break;
          if (cut(targets[j], x1, y1, x2, y2)) any = true;
        }
        return any;
      }

      function showPreview(sx, sy, cx, cy) {
        var dx = cx - sx;
        var dy = cy - sy;
        var len = Math.sqrt(dx * dx + dy * dy);
        if (!len) return;
        if (!previewEl) {
          previewEl = document.createElement('div');
          previewEl.className = 'cut-preview';
          slicesEl.appendChild(previewEl);
        }
        previewEl.style.width = len + 'px';
        previewEl.style.left = sx + 'px';
        previewEl.style.top = sy + 'px';
        previewEl.style.transform = 'translate(0, -50%) rotate(' + Math.atan2(dy, dx) + 'rad)';
      }

      function hidePreview() {
        if (previewEl && previewEl.parentNode) previewEl.parentNode.removeChild(previewEl);
        previewEl = null;
      }

      document.addEventListener('pointerdown', onGestureDown);

      createTile([{ x: 0, y: 0 }, { x: 100, y: 0 }, { x: 100, y: 100 }, { x: 0, y: 100 }], 0, 0);
    })();
  </script>
</body>
</html>
