<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>胡萝卜的博客</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <meta name="description" content="胡萝卜的博客 / 像素风入口">
  <meta name="theme-color" content="#000000">
  <link rel="shortcut icon" href="/favicon.png">
  <link rel="preload" href="/assets/fonts/fusion-pixel-12.woff2" as="font" type="font/woff2" crossorigin>
  <style>
    @font-face {
      font-family: "Fusion Pixel";
      src: url("/assets/fonts/fusion-pixel-12.woff2") format("woff2");
      font-display: swap;
      font-weight: 400;
      font-style: normal;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
    }

    body {
      overflow: hidden;
      background: #000000;
      color: #ffffff;
      font-family: "Fusion Pixel", "Courier New", "SimHei", monospace;
      image-rendering: pixelated;
      -webkit-font-smoothing: none;
      text-rendering: optimizeSpeed;
    }

    /* 1bit 背景：纯黑 + 点阵月亮 + 方形星点 */
    .bg-layer {
      position: fixed;
      inset: 0;
      background-color: #000000;
      background-image:
        radial-gradient(2px 2px at 12% 18%, #ffffff 50%, transparent 51%),
        radial-gradient(2px 2px at 24% 34%, #ffffff 50%, transparent 51%),
        radial-gradient(2px 2px at 38% 12%, #ffffff 50%, transparent 51%),
        radial-gradient(2px 2px at 56% 26%, #ffffff 50%, transparent 51%),
        radial-gradient(2px 2px at 68% 40%, #ffffff 50%, transparent 51%),
        radial-gradient(2px 2px at 86% 48%, #ffffff 50%, transparent 51%),
        radial-gradient(2px 2px at 8% 62%, #ffffff 50%, transparent 51%),
        radial-gradient(2px 2px at 46% 58%, #ffffff 50%, transparent 51%),
        radial-gradient(2px 2px at 92% 72%, #ffffff 50%, transparent 51%),
        radial-gradient(2px 2px at 16% 84%, #ffffff 50%, transparent 51%);
      background-repeat: no-repeat;
    }

    /* 棋盘格月亮：只由黑白两色组成 */
    .bg-layer::before {
      content: "";
      position: absolute;
      top: 9vh;
      right: 9vw;
      width: 132px;
      height: 132px;
      border-radius: 50%;
      background-image: conic-gradient(#ffffff 25%, #000000 0 50%, #ffffff 0 75%, #000000 0);
      background-size: 8px 8px;
      box-shadow:
        0 0 0 4px #000000,
        0 0 0 6px #ffffff;
    }

    /* 四角像素边框 */
    .frame {
      position: fixed;
      inset: 12px;
      border: 2px solid #ffffff;
      pointer-events: none;
    }

    .frame::before,
    .frame::after {
      content: "";
      position: absolute;
      width: 10px;
      height: 10px;
      background: #ffffff;
    }

    .frame::before {
      top: -2px;
      left: -2px;
    }

    .frame::after {
      bottom: -2px;
      right: -2px;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
      border: 0;
    }

    .menu-panel {
      position: fixed;
      left: 50%;
      bottom: 12vh;
      transform: translateX(-50%);
      width: min(420px, 86vw);
      padding: 14px;
      background: #000000;
      border: 3px solid #ffffff;
      box-shadow: 8px 8px 0 #ffffff;
    }

    .menu-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .menu-item {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      padding: 13px 16px;
      color: #ffffff;
      font-size: 24px;
      font-weight: 400;
      letter-spacing: 3px;
      line-height: 1;
      text-decoration: none;
      text-transform: uppercase;
      border: 2px solid transparent;
      transition: background-color 0.08s linear, color 0.08s linear, border-color 0.08s linear;
    }

    .menu-item:hover,
    .menu-item:focus-visible {
      background: #ffffff;
      color: #000000;
      border-color: #000000;
      outline: none;
    }

    .menu-arrow {
      flex: 0 0 auto;
      width: 0;
      height: 0;
      border-top: 8px solid transparent;
      border-bottom: 8px solid transparent;
      border-left: 13px solid #ffffff;
      opacity: 0;
      transform: translateX(-8px);
      transition: opacity 0.08s linear, transform 0.08s linear;
    }

    .menu-item:hover .menu-arrow,
    .menu-item:focus-visible .menu-arrow {
      opacity: 1;
      transform: translateX(0);
    }

    .menu-item:hover .menu-arrow,
    .menu-item:focus-visible .menu-arrow {
      border-left-color: #000000;
    }

    @media (max-width: 520px) {
      .bg-layer::before {
        top: 6vh;
        right: 8vw;
        width: 96px;
        height: 96px;
      }

      .menu-panel {
        bottom: 8vh;
        padding: 10px;
        box-shadow: 6px 6px 0 #ffffff;
      }

      .menu-item {
        font-size: 24px;
        letter-spacing: 2px;
        padding: 12px 10px;
      }
    }
  </style>
</head>
<body>
  <div class="bg-layer" aria-hidden="true"></div>
  <div class="frame" aria-hidden="true"></div>

  <h1 class="sr-only">胡萝卜的博客</h1>

  <main class="menu-panel" aria-label="主菜单">
    <ul class="menu-list">
      <li>
        <a class="menu-item" href="/game/">
          <span class="menu-arrow" aria-hidden="true"></span>
          <span>NEW GAME</span>
        </a>
      </li>
      <li>
        <a class="menu-item" href="/blog/">
          <span class="menu-arrow" aria-hidden="true"></span>
          <span>LOAD GAME</span>
        </a>
      </li>
      <li>
        <a class="menu-item" href="/setting/">
          <span class="menu-arrow" aria-hidden="true"></span>
          <span>SETTING</span>
        </a>
      </li>
    </ul>
  </main>
</body>
</html>
