<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>小游戏 - 胡萝卜的博客</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <meta name="description" content="小游戏演示">
  <meta name="theme-color" content="#000000">
  <link rel="shortcut icon" href="/favicon.png">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background-color: #000000;
      background-image:
        linear-gradient(0deg, #ffffff 1px, transparent 1px),
        linear-gradient(90deg, #ffffff 1px, transparent 1px);
      background-size: 16px 16px;
      image-rendering: pixelated;
    }

    .boot-flash {
      position: fixed;
      inset: 0;
      z-index: 999;
      background: #ffffff;
      pointer-events: none;
      animation: boot-flash 0.95s steps(6, end) forwards;
    }

    @keyframes boot-flash {
      0%, 40% {
        opacity: 1;
      }
      100% {
        opacity: 0;
      }
    }

    .frame {
      position: relative;
      width: min(880px, 92vw);
      padding: 12px;
      background: #000000;
      border: 3px solid #ffffff;
      box-shadow:
        0 0 0 6px #000000,
        0 0 0 7px #ffffff;
    }

    .frame::before,
    .frame::after {
      content: "";
      position: absolute;
      width: 10px;
      height: 10px;
      background: #ffffff;
    }

    .frame::before {
      top: -3px;
      left: -3px;
    }

    .frame::after {
      bottom: -3px;
      right: -3px;
    }

    .frame video {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000000;
      border: 2px solid #ffffff;
    }

    @media (max-width: 480px) {
      body {
        padding: 16px;
      }

      .frame {
        padding: 6px;
        border-width: 2px;
        box-shadow:
          0 0 0 4px #000000,
          0 0 0 5px #ffffff;
      }

      .frame video {
        border-width: 1px;
      }
    }
  </style>
</head>
<body>
  <div class="boot-flash" aria-hidden="true"></div>

  <div class="frame">
    <video id="gameVideo" src="/assets/game/game-demo.mp4" controls autoplay loop playsinline preload="auto"></video>
  </div>

  <script>
    (function(){
      var video = document.getElementById('gameVideo');
      if (!video) return;

      function playWithSound() {
        video.muted = false;
        var p = video.play();
        if (p && p.catch) {
          p.catch(function(){
            // 浏览器拦截有声自动播放时，先静音播放，保证画面动起来
            video.muted = true;
            var p2 = video.play();
            if (p2 && p2.catch) p2.catch(function(){});
          });
        }
      }

      playWithSound();

      // 用户首次与页面交互时再次尝试开启声音
      document.addEventListener('pointerdown', function(){
        if (!video.muted) return;
        video.muted = false;
        var p = video.play();
        if (p && p.catch) p.catch(function(){});
      });
    })();
  </script>
</body>
</html>
