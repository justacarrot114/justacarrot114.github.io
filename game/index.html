<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>小游戏 - 胡萝卜的博客</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <meta name="description" content="小游戏页面（占位中）">
  <link rel="shortcut icon" href="/favicon.png">
  <link rel="preload" href="/assets/fonts/fusion-pixel-12.woff2" as="font" type="font/woff2" crossorigin>
  <style>
    @font-face {
      font-family: "Fusion Pixel";
      src: url("/assets/fonts/fusion-pixel-12.woff2") format("woff2");
      font-display: swap;
      font-weight: 400;
      font-style: normal;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background:
        linear-gradient(0deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px) 0 0 / 16px 16px,
        linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px) 0 0 / 16px 16px,
        #1a1c2c;
      color: #f4f4f4;
      font-family: "Fusion Pixel", "Courier New", "SimHei", monospace;
      image-rendering: pixelated;
      -webkit-font-smoothing: none;
    }

    .game-screen {
      width: min(520px, 100%);
      text-align: center;
    }

    .game-title {
      font-size: 36px;
      font-weight: 400;
      letter-spacing: 4px;
      color: #ffcd75;
      text-shadow:
        4px 0 #333c57,
        -4px 0 #333c57,
        0 4px 0 #333c57,
        0 -4px 0 #333c57;
      margin-bottom: 20px;
    }

    .game-text {
      font-size: 24px;
      line-height: 1.8;
      letter-spacing: 2px;
      color: #94b0c2;
      margin-bottom: 40px;
    }

    .game-back {
      display: inline-block;
      padding: 10px 22px;
      font: inherit;
      font-size: 24px;
      letter-spacing: 4px;
      text-decoration: none;
      color: #f4f4f4;
      background: #333c57;
      border: 4px solid #f4f4f4;
      box-shadow: 6px 6px 0 #11121c;
    }

    .game-back:hover,
    .game-back:focus-visible {
      background: #566c86;
      outline: none;
    }

    .game-back:active {
      transform: translate(6px, 6px);
      box-shadow: none;
    }

    @media (max-width: 480px) {
      .game-title {
        font-size: 24px;
      }
    }
  </style>
</head>
<body>
  <main class="game-screen">
    <h1 class="game-title">小 游 戏</h1>
    <p class="game-text">开发中<br>敬请期待</p>
    <a class="game-back" href="/">返回开屏</a>
  </main>
</body>
</html>
